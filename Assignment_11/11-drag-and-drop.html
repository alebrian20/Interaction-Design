<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Exercise 11 - Drag and Drop</title>

    <style>

html, body {
    margin: 0;
    padding: 0;
}

#space {
    width: 100vw;
    height: 100vh;
    background-image: url("wormhole.jpg");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 800px 400px;
    background-color: #000;
    position: relative;
    overflow: hidden;
}



#blackhole {
    width: 400px;
    height: 300px;
    background: rgba(0, 255, 0, .4);
    position: absolute;

    left: 50%;
    top: 50%;

    margin-left: -200px;
    margin-top: -190px;
}

        #tardis {
            width: 200px;
            height: 200px;
            background: url("tardis.png");
            position: absolute;
            top: 100px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            100% {
                transform: rotate(720deg) scale(.01);
            }
        }

        .animated {
            animation: spin 3s ease-out;
            animation-fill-mode: forwards;
        }
    </style>

    <script src="jquery.min.js"></script>
    <script src="jquery-ui.min.js"></script>
</head>

<body>

    <div id="space">
        <div id="blackhole"></div>
        <div id="tardis"></div>
    </div>

   <script>
    $('#tardis').draggable();

    $('#blackhole').droppable({
        tolerance: 'pointer',
        drop: destroy
    });

    function destroy() {
        $('#tardis').animate(
            {
                top: '325px',
                left: '790px'
            },
            3000,
            'easeOutQuad'
        );

        $('#tardis').addClass('animated');
    }
</script>

</body>
</html>

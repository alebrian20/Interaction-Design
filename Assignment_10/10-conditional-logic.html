<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Exercise 10: Conditional Logic</title>
    <link href="../resources/reset.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta name="viewport" content="width=device-width">

    <style>
        #toggle {
            width: 60px;
            height: 30px;
            background: #666;
            border-radius: 15px;
            border: 1px solid #666;
            box-shadow: 3px 3px 5px #444 inset;
            position: relative;
        }

        #switch {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #eee;
            border-radius: 50%;
            top: 1px;
            left: 1px;
            cursor: pointer;
        }

        table {
            margin: auto;
        }

        #label_on {
            color: #bbb;
        }

        #slidebox {
    position: fixed;
    left: -180px;
    top: 200px;
    width: 200px;
    height: 80px;
    background: #ddd;
    border: 1px solid #666;
    padding: 10px;
    box-sizing: border-box;
}

#arrow {
    position: absolute;
    right: 5px;
    top: 25px;
    font-size: 30px;
    cursor: pointer;
    transition: transform 0.5s;
}
    </style>

</head>

<body>

    <h1>Exercise 10: Conditional Logic</h1>

    <table border="0" cellspacing="5" cellpadding="0">

        <tr>
            <td id="label_off">OFF</td>

            <td>
                <figure id="toggle">
                    <figcaption id="switch"></figcaption>
                </figure>
            </td>

            <td id="label_on">ON</td>
        </tr>

    </table>

    <div id="slidebox">
        <span id="arrow">&#9656;</span>
        jQuery Challenge
    </div>

    <script>
    function toggleSwitch(){
        if($('#switch').css('left') == '1px'){
            $('#switch').animate({left:'31px'}, 200, turnOn);
        }else{
            $('#switch').animate({left:'1px'}, 200, turnOff);
        }
    }

    function turnOn(){
        $('#label_on').css('color', '#000');
        $('#label_off').css('color', '#bbb');
        $('#toggle').css('backgroundColor', '#62bb26');
    }

    function turnOff(){
        $('#label_on').css('color', '#bbb');
        $('#label_off').css('color', '#000');
        $('#toggle').css('backgroundColor', '#666');
    }

    $('#switch').click(toggleSwitch);
    function slideBox(){
    if($('#slidebox').css('left') == '-180px'){
        $('#slidebox').animate({left:'0px'}, 500, function(){
            $('#arrow').css('transform','scaleX(-1)');
        });
    }else{
        $('#slidebox').animate({left:'-180px'}, 500, function(){
            $('#arrow').css('transform','scaleX(1)');
        });
    }
}

$('#arrow').click(slideBox);
</script>

</body>

</html>

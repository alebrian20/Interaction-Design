<!DOCTYPE html>
<html>

<head>
    <title>Exercise 12: Drag & Drop</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link href="reset.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width">
    <style>
        body {
            background: linear-gradient(top, #ddd 0%, #777 100%);
            text-align: center;
        }

        figure {
            background: url(modelX.png) no-repeat;
            max-width: 750px;
            height: 330px;
            padding-bottom: 2em;
            margin: 0 auto 2em auto;
            background-size: contain;
        }

        figcaption {
            font-size: 2em;
            color: #444;
        }

        ul {
            background: #989898;
            padding: 15px 30px 10px 30px;
            display: inline-block;
            border-radius: 100px;
            box-shadow: 3px 3px 8px #222 inset, -1px -1px 0px #fff inset;
        }

        li {
            list-style: none;
            width: 50px;
            height: 50px;
            border-radius: 4px;
            box-shadow: 3px 3px 4px #fff inset, -3px -3px 4px #222 inset;
            display: inline-block;
            margin: 0 6px;
            box-sizing: border-box;
            background-image: url(shine.svg);
        }

        #Titanium {
    background-color: #6f6e6b;
}

#Blue {
    background-color: #0066cc;
}

#Dolphin {
    background-color: #72777a;
}

#Pearl {
    background-color: #f2f2f2;
}

#Black {
    background-color: #000;
}

#Red {
    background-color: #ef3f23;
}

#Orange {
    background-color: #f7941d;
}

#Green {
    background-color: #008000;
}

.active {
    border: 4px solid white;
}

.paint {
    fill:#6f6e6b;
    mix-blend-mode: overlay;
    transition: all 1s;

}

    </style>
    <script src="jquery.min.js"></script>
    <script src="jquery-ui.min.js"></script>
    <script src="jquery.ui.touch-punch.min.js"></script>
</head>


<body>
    <h1>Exercise 12: Drag & Drop</h1>
    <audio>
    <source src="splat.mp3" type="audio/mp3">
</audio>


    <figure>

    <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
        viewBox="-20 142 750 330" style="enable-background:new -20 142 750 330;" xml:space="preserve">
    
    <path class="paint" d="M21.7,326.2l-14.3-7.7l-2.7-16c0,0,6-13.3,6-18.3s1-20.3,1-20.3s9.9,1.6,12,0s2.9-4.6,0-10.2c-2.9-5.7-6.5-14.1-5.3-17.8s4.9-5.3,11.5-9s46.9-33.5,66.8-42.9c22.1-10.4,60.5-23,107-25.6c27.9-1.6,64.8-2,92.2,7.4
    
    </svg>

    <figcaption></figcaption>
    
</figure>

    <ul>
        <li id="Titanium" class="active"></li>
        <li id="Blue"></li>
        <li id="Dolphin"></li>
        <li id="Pearl"></li>
        <li id="Black"></li>
        <li id="Red"></li>
        <li id="Orange"></li>
        <li id="Green"></li>

    </ul>

 <script>
    var color = '#6f6e6b';
    var colorName = 'Titanium';
    var sound = $('audio')[0];

    $('figcaption').html(colorName);

function grab() {
    colorName = $(this).attr('id');
    color = $(this).css('backgroundColor');
    $('li').removeClass('active');
    $(this).addClass('active');
}

   $('li').draggable({
    revert: true,
    revertDuration: .1,
    opacity: .5,
    start: grab
});

    $('figure').droppable({
        drop: repaint
    });

   function repaint() {
    $('.paint').css({fill:color});
    $('figcaption').html(colorName);
     sound.play();
}
</script>

</body>

</html>
